<div class="page-intro wrap"><p class="eyebrow">ABOUT Q-LAB</p><h1 data-zh="关于 Q-lab" data-en="About Q-lab">关于 Q-lab</h1><p class="page-lead" data-zh="Q-lab 致力于 AI 基础研究，关注物理世界中的智能系统。" data-en="Q-lab is dedicated to fundamental AI research, with a focus on intelligent systems in the physical world.">Q-lab 致力于 AI 基础研究，关注物理世界中的智能系统。</p></div><div class="reading-page wrap"><section class="editorial-row"><div><h2 data-zh="我们的工作" data-en="Our work">我们的工作</h2></div><div><p data-zh="我们研究几何与物理表示、具身智能、永续学习和心智模型，并关注这些能力如何组成可靠的物理 AI 系统。" data-en="We study geometric and physical representations, embodied intelligence, continual learning, and mental models, and how these capabilities can form reliable physical AI systems.">我们研究几何与物理表示、具身智能、永续学习和心智模型，并关注这些能力如何组成可靠的物理 AI 系统。</p><p data-zh="通过我们的物理 AI 系统，让机器人真正无缝融入人类社会的所有方面。" data-en="Our vision is to enable robots to integrate seamlessly into every aspect of human society through our physical AI systems.">通过我们的物理 AI 系统，让机器人真正无缝融入人类社会的所有方面。</p><a class="text-link" href="vision.html"><span data-zh="了解愿景" data-en="Read our vision">了解愿景</span><span aria-hidden="true">↗</span></a></div></section><section class="editorial-row"><div><h2 data-zh="公开项目" data-en="Public projects">公开项目</h2></div><div><p data-zh="已公开的项目与代码可在 Q-lab 的 GitHub 组织中查看。" data-en="Explore our publicly available projects and code in the Q-lab GitHub organization.">已公开的项目与代码可在 Q-lab 的 GitHub 组织中查看。</p><a class="text-link" href="https://github.com/Qingyan-QLab"><span data-zh="访问 Q-lab GitHub" data-en="Visit Q-lab on GitHub">访问 Q-lab GitHub</span><span aria-hidden="true">↗</span></a></div></section></div>
